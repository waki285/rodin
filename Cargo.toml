# Cargo.toml
[package]
name = "rodin"
version = "0.1.0"
edition = "2024"
build = "build.rs"
default-run = "rodin"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
base64 = "0.22"
chrono = "0.4.42"
dotenvy = "0.15.7"
futures = "0.3"
hmac = "0.13"
image = "0.25.9"
itertools = "0.14.0"
leptos = { version = "0.8.20", default-features = false, features = ["ssr"] }
minify-html = "0.18.1"
rand = "0.9.2"
rayon = "1.11"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "form",
    "system-proxy",
    "json",
    "rustls",
    "blocking",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
] }
tower = { version = "0.5.2", features = ["tokio", "util"] }
tower-http = { version = "0.7", features = [
    "fs",
    "compression-br",
    "compression-gzip",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
typst = "0.15.1"
typst-as-lib = { version = "0.16.0", features = [
    "typst-kit-fonts",
    "typst-kit-embed-fonts",
    "typst-html",
] }
typst-html = "0.15.1"
typst-library = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.10", features = ["v4"] }
webauthn-rs = "0.5"

[target.'cfg(not(windows))'.dependencies]
hb-subset = "0.3.0"

[target.'cfg(not(windows))'.build-dependencies]
hb-subset = "0.3.0"

[build-dependencies]
anyhow = "1.0.100"
hex = "0.4"
image = "0.25.9"
itertools = "0.14.0"
lightningcss = { version = "1.0.0-alpha.68", features = ["browserslist"] }
minify-html = "0.18.1"
rayon = "1.11"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
typst = "0.15.1"
typst-as-lib = { version = "0.16.0", features = [
    "typst-kit-fonts",
    "typst-kit-embed-fonts",
    "typst-html",
] }
typst-html = "0.15.1"
typst-library = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = "symbols"

[lints.rust]
unfulfilled_lint_expectations = "deny"

[lints.clippy]
allow_attributes = "deny" # Use #[expect(lint_name)] instead